<!doctype html>
<html><head><meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden}
body{background:#231f1a;font-family:'Poppins',sans-serif;color:#f4f1ea;position:relative}
.topline{position:absolute;left:0;top:0;width:1200px;height:6px;
  background:linear-gradient(90deg,#c19a3a 0%,#dcb85c 40%,#c19a3a 100%)}
.photo{position:absolute;left:78px;top:90px;width:450px;height:450px;border-radius:50%;
  background:url('founder-photo.jpg') center/cover;box-shadow:0 8px 40px rgba(0,0,0,.45)}
.ring{position:absolute;left:66px;top:78px;width:474px;height:474px;border-radius:50%;
  border:1px solid rgba(193,154,58,.35)}
.right{position:absolute;left:600px;top:0;width:520px;height:630px;
  display:flex;flex-direction:column;justify-content:center}
.name{font-family:'Lora',serif;font-weight:700;font-size:54px;letter-spacing:1.5px;color:#fbf8f1;line-height:1}
.role{font-size:19px;font-weight:400;color:#d4ae56;margin-top:14px;letter-spacing:.6px}
.rule{width:92px;height:1px;background:rgba(193,154,58,.55);margin:26px 0}
.line{font-family:'Lora',serif;font-weight:400;font-size:27px;line-height:1.38;color:#e6e1d6}
.line b{font-weight:700;color:#fbf8f1}
.stats{display:flex;gap:40px;margin-top:34px}
.s{}
.sn{font-family:'Lora',serif;font-weight:700;font-size:30px;color:#d4ae56;line-height:1}
.sl{font-size:12px;font-weight:300;color:#9b9384;margin-top:6px;letter-spacing:1.3px;text-transform:uppercase}
.url{position:absolute;left:600px;bottom:56px;font-size:15px;font-weight:300;color:#8d8577;letter-spacing:1.2px}
</style></head><body>
<div class="topline"></div>
<div class="ring"></div>
<div class="photo"></div>
<div class="right">
  <div class="name">PUNEET RAWAT</div>
  <div class="role">Founder, LUDIFU &middot; Mumbai</div>
  <div class="rule"></div>
  <div class="line">Fifteen ventures.<br><b>None closed because of money.</b></div>
  <div class="stats">
    <div class="s"><div class="sn">2007</div><div class="sl">First venture</div></div>
    <div class="s"><div class="sn">&#8377;0</div><div class="sl">Outside capital</div></div>
    <div class="s"><div class="sn">4,500+</div><div class="sl">Interns trained</div></div>
  </div>
</div>
<div class="url">ludifu.com/founder</div>
</body></html>
